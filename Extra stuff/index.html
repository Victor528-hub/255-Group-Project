<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIY Material Estimator Kiosk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="header-title">
    <h1>DIY Material Estimator Kiosk</h1>
    <p>Estimate your paint and tile needs for your home projects!</p>
</div>

<div class="kiosk-container">
    <!-- Input cards -->
    <div class="card">
        <h2>Material Estimator</h2>
        
        <div class="tab-buttons">
            <button class="tab-btn active-paint" id="paintTabBtn" onclick="switchTab('paint')">Paint Room</button>
            <button class="tab-btn" id="tileTabBtn" onclick="switchTab('tile')">Tile Floor</button>
        </div>

        <form id="estimatorForm" onsubmit="handleFormSubmit(event)">
            <input type="hidden" id="material_type" value="paint">

            <div class="form-group">
                <label for="room_name">Room Name / Label</label>
                <input type="text" id="room_name" placeholder="e.g. Master Bedroom" required>
            </div>

            <!-- Paint inputs -->
            <div id="paintForm">
                <div class="form-group"><label>Room Length (ft)</label><input type="number" step="0.1" id="p_length" value="12"></div>
                <div class="form-group"><label>Room Width (ft)</label><input type="number" step="0.1" id="p_width" value="10"></div>
                <div class="form-group"><label>Wall Height (ft)</label><input type="number" step="0.1" id="p_height" value="8"></div>
                <div class="form-group"><label>Number of Doors</label><input type="number" id="p_doors" value="1"></div>
                <div class="form-group"><label>Number of Windows</label><input type="number" id="p_windows" value="2"></div>
            </div>

            <!-- Tile inputs -->
            <div id="tileForm" class="hidden">
                <div class="form-group"><label>Floor Length (ft)</label><input type="number" step="0.1" id="t_length" value="10"></div>
                <div class="form-group"><label>Floor Width (ft)</label><input type="number" step="0.1" id="t_width" value="10"></div>
            </div>

            <button type="submit" class="btn-submit">➕ Add Room to Estimate</button>
        </form>
    </div>

    <!-- cart / checkout section -->
    <div class="card">
        <h2>🛒 Total Project Estimate</h2>

        <!-- paint section -->
        <div class="cart-section">
            <h3>🎨 Paint Supplies</h3>
            <div id="paintCartContent"><p>No paint calculations added yet.</p></div>
        </div>

        <!-- Tile section -->
        <div class="cart-section tile-section">
            <h3>Tile Supplies</h3>
            <div id="tileCartContent"><p>No tile calculations added yet.</p></div>
        </div>

        <button id="clearCartBtn" class="btn-clear hidden" onclick="clearCart()">🗑️ Start New Project</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
