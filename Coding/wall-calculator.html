<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Wall Paint Calculator</title>
        <link rel="stylesheet" href="css/styles.css">
    </head>
    
    <body>

        <h1>Wall Paint Calculator</h1>
        <label for="room-length">Room Length:</label>
        <input type="number" id="room-length" name="room-length">
        <span>ft</span>

        <br><br>

        <label for="room-width">Room Width:</label>
        <input type="number" id="room-width" name="room-width">
        <span>ft</span>

        <br><br>

        <label for="wall-height">Wall Height:</label>
        <input type="number" id="wall-height" name="wall-height">
        <span>ft</span>

        <br><br>

        <button type="button" id="calculate-button">Calculate</button>
        <button type="button" id="reset-button">Reset</button>

        <br><br>
        <p id="error-message"></p>

        <p>Wall Square Footage: <span id="wall-square-footage">0</span> sq. ft.</p>
        <p>Paint Needed: <span id="paint-needed">0</span> gallons</p>
        
        <script src="js/wall-calculator.js"></script>
    </body>

    </html>
