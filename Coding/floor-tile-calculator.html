<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Floor Tile Calculator</title>
    </head>

    <body>
        <h1>Floor Tile Calculator</h1>

        <label for="floor-length">Floor Length:</label>
        <input type="number" id="floor-length" name="floor-length">
        <span>ft</span>
        
        <br><br>

        <label for="floor-width">Floor Width:</label>
        <input type="number" id="floor-width" name="floor-width">
        <span>ft</span>

        <br><br>

        <button type="button" id="calculate-button">Calculate</button>
        <button type="button" id="reset-button">Reset</button>

        <p id="error-message"></p>

        <p>
            Floor Square Footage:
            <span id="floor-square-footage">0</span> sq. ft.
        </p>

        <p>
            Tile Needed:
            <span id="tile-needed">0</span>sq. ft.
        </p>

        <script src="js/floor-tile-calculator.js"></script>
    </body>
</html>
