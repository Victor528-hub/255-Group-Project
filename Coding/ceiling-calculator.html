<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, inital-scale=1.0">
        <title>Ceiling Paint Calculator</title>
    </head>
    <body>
        <h1>Ceiling Paint Calculator</h1>
        <label for="ceiling-length">Ceiling Length:</label>
        <input type="number" 
        id="ceiling-length" 
        name="ceiling-length"
        min="0.1"
        step="0.1"
        required
        >
        <span>ft</span>
        
        <br><br>

        <label for="ceiling-width">Ceiling Width:</label>
        <input type="number" 
        id="ceiling-width" 
        name="ceiling-width"
        min="0.1"
        step="0.1"
        required
        >
        <span>ft</span>

        <br><br>
        
        <button type="button" id="calculate-button">Calculate</button>
        <button type="button" id="reset-button">Reset</button>
        
        <p id="error-message"></p>
        
        <br><br>

        <p>Square Footage: <span id="square-footage">0</span> sq. ft. </p>

        <p>Paint Needed: <span id="paint-needed">0</span> gallons</p>
   
        <script src="js/ceiling-calculator.js"></script>
    </body>
</html>
